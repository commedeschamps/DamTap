spring.application.name=damtap-backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/damtap;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never

app.seed-demo=${SEED_DEMO:true}
app.admin-key=${ADMIN_API_KEY:}

# Reservations fail closed until a trusted issuer and expected audience are configured.
app.customer-jwt-issuer=${CUSTOMER_JWT_ISSUER:}
app.customer-jwt-audience=${CUSTOMER_JWT_AUDIENCE:}
app.public-write-limit-per-minute=30
app.global-write-limit-per-minute=300
server.forward-headers-strategy=none
